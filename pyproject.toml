[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "slippage-predictor"
version = "0.1.0"
description = "Neural-network model for transaction cost / slippage prediction on intraday OHLCV data."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Francesco Natale", email = "fnatale1503@gmail.com" }]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "yfinance>=0.2.40",
    "pyarrow>=15",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "jupyter>=1.0",
    "ipykernel>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.urls]
Repository = "https://github.com/francesconatale/slippage-predictor"
Issues = "https://github.com/francesconatale/slippage-predictor/issues"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "paths", "data_loader", "features", "proxy", "dataset",
    "pipeline", "model", "train", "baselines", "evaluate", "viz",
    "walk_forward",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
