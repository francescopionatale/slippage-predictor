[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "slippage-predictor"
version = "0.1.0"
description = "Neural-network model for transaction cost / slippage prediction on intraday OHLCV data."
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "yfinance>=0.2.40",
    "pyarrow>=15",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "jupyter>=1.0",
    "ipykernel>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "paths", "data_loader", "features", "proxy", "dataset",
    "pipeline", "model", "train", "baselines", "evaluate", "viz",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
